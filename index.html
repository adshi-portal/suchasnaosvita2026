<title id="pageTitle">Сучасна освіта 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#EEECE2;
    --surface:#FBFAF5;
    --surface-2:#F2F0E6;
    --ink:#1E2A38;
    --ink-soft:#4B5768;
    --ink-faint:#7C8698;
    --line:#CFC9B6;
    --line-strong:#B7AF97;
    --accent:#1F5FA8;
    --accent-ink:#0F3E75;
    --accent-soft:#DCE7F4;
    --gold:#A9781F;
    --gold-soft:#F1E4C4;
    --good:#2E7D4F;
    --good-soft:#DFEEE2;
    --warn:#B5701A;
    --warn-soft:#F6E6CC;
    --danger:#B23A3A;
    --danger-soft:#F5DEDE;
    --shadow: 0 1px 2px rgba(30,42,56,.06), 0 8px 24px -12px rgba(30,42,56,.18);
    --radius:10px;
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-body:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1826;
      --surface:#152234;
      --surface-2:#101B2A;
      --ink:#E9E6DA;
      --ink-soft:#B7C0CE;
      --ink-faint:#7F8CA0;
      --line:#2B3B52;
      --line-strong:#3B4E69;
      --accent:#7EAEE0;
      --accent-ink:#BEDAF5;
      --accent-soft:#1C324E;
      --gold:#E0B255;
      --gold-soft:#3A3016;
      --good:#7ECB9B;
      --good-soft:#173325;
      --warn:#E5B15C;
      --warn-soft:#3A2C11;
      --danger:#E28787;
      --danger-soft:#3A1E1E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1826;
    --surface:#152234;
    --surface-2:#101B2A;
    --ink:#E9E6DA;
    --ink-soft:#B7C0CE;
    --ink-faint:#7F8CA0;
    --line:#2B3B52;
    --line-strong:#3B4E69;
    --accent:#7EAEE0;
    --accent-ink:#BEDAF5;
    --accent-soft:#1C324E;
    --gold:#E0B255;
    --gold-soft:#3A3016;
    --good:#7ECB9B;
    --good-soft:#173325;
    --warn:#E5B15C;
    --warn-soft:#3A2C11;
    --danger:#E28787;
    --danger-soft:#3A1E1E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; text-wrap:balance; color:var(--ink);}
  p{margin:0 0 1em;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
  .mono{font-family:var(--font-mono);}
  .container{max-width:1080px; margin:0 auto; padding:0 24px;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none!important;}

  /* background blueprint-grid texture on page ground */
  .grid-ground{
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:32px 32px;
    background-position:center top;
    opacity:.35;
    position:fixed; inset:0; z-index:0; pointer-events:none;
    mask-image:linear-gradient(to bottom, black, transparent 700px);
  }

  /* ============ HEADER / NAV ============ */
  header.site{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .head-row{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:14px 24px; max-width:1080px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-right:auto; text-decoration:none;}
  .brand-mark{
    width:40px; height:40px; border-radius:8px;
    background:linear-gradient(155deg, var(--accent), var(--accent-ink));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; font-size:12px; letter-spacing:.02em;
    flex:none; box-shadow:var(--shadow);
  }
  .brand-text{line-height:1.2;}
  .brand-text .t1{font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--ink);}
  .brand-text .t2{font-family:var(--font-display); font-weight:500; font-size:12px; letter-spacing:.02em; color:var(--ink-faint);}
  nav.tabs{display:flex; gap:2px; flex-wrap:wrap;}
  nav.tabs button{
    border:1px solid transparent; background:transparent; color:var(--ink-soft);
    padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer;
    font-weight:500; transition:background .15s, color .15s;
  }
  nav.tabs button:hover{background:var(--surface-2); color:var(--ink);}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .head-controls{display:flex; align-items:center; gap:8px; flex:none;}
  .theme-toggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:36px; height:36px; border-radius:8px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .lang-toggle{
    width:auto; padding:0 12px; font-family:var(--font-mono); font-weight:700;
    font-size:12.5px; letter-spacing:.03em;
  }

  /* ============ GENERIC LAYOUT ============ */
  main{position:relative; z-index:1;}
  section.view{padding:52px 0 88px;}
  .eyebrow{
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.09em;
    font-size:12px; color:var(--accent-ink); font-weight:600; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dash{width:20px; height:1px; background:var(--accent);}
  .lede{font-size:18px; color:var(--ink-soft); max-width:62ch;}
  .col-2{display:grid; grid-template-columns:1.3fr 1fr; gap:40px;}
  .col-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:860px){ .col-2{grid-template-columns:1fr;} .col-3{grid-template-columns:1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; box-shadow:var(--shadow);
  }
  .panel{
    background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--radius);
    padding:18px 20px;
  }
  .divider{height:1px; background:var(--line); border:0; margin:40px 0;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:11px 20px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    text-decoration:none; transition:transform .1s ease, background .15s, border-color .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:7px;}
  .btn-danger-ghost{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .badge{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
    font-size:11.5px; letter-spacing:.03em; padding:4px 9px; border-radius:99px;
    border:1px solid var(--line-strong); color:var(--ink-soft); text-transform:uppercase;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
    padding:4px 11px; border-radius:99px;
  }
  .chip-submitted{background:var(--accent-soft); color:var(--accent-ink);}
  .chip-review{background:var(--warn-soft); color:var(--warn);}
  .chip-revise{background:var(--danger-soft); color:var(--danger);}
  .chip-accepted{background:var(--good-soft); color:var(--good);}

  /* ============ HOME / HERO ============ */
  .hero{padding:44px 0 20px;}
  .letterhead{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    display:flex; flex-wrap:wrap; gap:6px 14px; line-height:1.5; margin-bottom:30px;
    max-width:920px;
  }
  h1.title{
    font-size:clamp(34px,6.4vw,72px); line-height:1.06; max-width:none; width:100%;
    color:var(--accent); margin:6px 0 26px;
  }
  .meta-row{display:flex; flex-wrap:wrap; gap:10px 26px; margin:22px 0 30px; font-size:14.5px;}
  .meta-item{display:flex; align-items:center; gap:8px; color:var(--ink-soft);}
  .meta-item .k{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .cta-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:44px 0;}
  .stat{background:var(--surface); padding:18px 20px;}
  .stat .n{font-family:var(--font-display); font-size:28px; font-weight:600; color:var(--accent-ink);}
  .stat .l{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  @media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

  .timeline{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); margin-left:6px;}
  .timeline li{position:relative; padding:2px 0 26px 26px;}
  .timeline li::before{
    content:''; position:absolute; left:-7px; top:4px; width:12px; height:12px;
    border-radius:50%; background:var(--surface); border:2px solid var(--accent);
  }
  .timeline li.done::before{background:var(--good); border-color:var(--good);}
  .timeline li.now::before{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft);}
  .timeline .tl-date{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
  .timeline .tl-title{font-weight:600; margin:2px 0 2px;}
  .timeline .tl-desc{font-size:14px; color:var(--ink-soft);}
  .countdown{font-family:var(--font-mono); font-size:12.5px; color:var(--gold); font-weight:600;}

  /* ============ ABOUT ============ */
  .org-list{
    columns:2 260px; column-gap:28px; font-size:13.5px; color:var(--ink-soft);
    list-style:none; margin:0; padding:0;
  }
  .org-list li{break-inside:avoid; padding:5px 0 5px 16px; position:relative; border-bottom:1px dotted var(--line);}
  .org-list li::before{content:'—'; position:absolute; left:0; color:var(--ink-faint);}

  .goal-list{list-style:none; margin:0; padding:0; display:grid; gap:14px;}
  .goal-list li{display:flex; gap:14px; align-items:flex-start;}
  .goal-num{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-ink); background:var(--accent-soft);
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex:none; font-weight:600; margin-top:1px;
  }

  .committee-grid{
    columns:2 300px; column-gap:26px; font-size:13.5px;
  }
  .committee-grid .person{break-inside:avoid; padding:8px 0; border-bottom:1px solid var(--line);}
  .committee-grid .p-name{font-weight:600; color:var(--ink);}
  .committee-grid .p-role{color:var(--ink-faint); font-size:12.5px;}
  details.reveal{margin-top:6px;}
  details.reveal > summary{
    cursor:pointer; font-weight:600; color:var(--accent); font-size:14px; list-style:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  details.reveal > summary::-webkit-details-marker{display:none;}
  details.reveal > summary::before{content:'▸'; font-size:11px; transition:transform .15s;}
  details.reveal[open] > summary::before{transform:rotate(90deg);}

  .section-card{border-top:3px solid var(--accent);}
  .section-card .sc-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .section-card .sc-num{font-family:var(--font-mono); color:var(--accent); font-weight:700; font-size:13px;}
  .section-card h3{font-size:18px; margin:0;}
  .section-card ul{margin:0; padding-left:18px; color:var(--ink-soft); font-size:14px; display:grid; gap:6px;}

  .lang-row{display:flex; gap:10px; margin-top:6px;}

  /* ============ FORMS ============ */
  form.doc-form{display:grid; gap:18px;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .field-grid.g3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:700px){ .field-grid, .field-grid.g3{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .field .hint{font-size:12px; color:var(--ink-faint); font-weight:400;}
  .field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=number], .field select, .field textarea{
    font-family:var(--font-body); font-size:15px; padding:10px 12px; border-radius:7px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    width:100%;
  }
  .field textarea{resize:vertical; min-height:80px; font-family:var(--font-body);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field.required label::after{content:' *'; color:var(--danger);}
  fieldset{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0;}
  fieldset legend{font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:0 6px;}
  .radio-row{display:flex; gap:18px; flex-wrap:wrap;}
  .radio-row label{display:flex; align-items:center; gap:7px; font-size:14.5px; cursor:pointer;}

  .author-row{
    display:grid; grid-template-columns:1.4fr 1.4fr .8fr .9fr auto; gap:10px; align-items:end;
    padding:12px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line);
  }
  @media (max-width:760px){ .author-row{grid-template-columns:1fr 1fr;} }
  .author-row .field{gap:4px;}
  .author-row .field label{font-size:11.5px;}
  .rm-author{background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:6px; width:32px; height:32px; cursor:pointer;}

  .checklist{display:grid; gap:10px;}
  .checklist .cl-group{border:1px solid var(--line); border-radius:8px; padding:12px 14px;}
  .checklist .cl-group h4{font-size:13px; text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-mono); color:var(--ink-faint); margin:0 0 8px; font-weight:600;}
  .cl-item{display:flex; align-items:flex-start; gap:9px; padding:5px 0; font-size:14px;}
  .cl-item input{margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--accent);}
  .cl-progress{
    height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:4px 0 2px;
  }
  .cl-progress > i{display:block; height:100%; background:var(--accent); width:0%; transition:width .2s;}

  .form-actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-top:6px;}
  .msg{font-size:13.5px; padding:10px 13px; border-radius:8px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--good-soft); color:var(--good);}
  .msg.err{background:var(--danger-soft); color:var(--danger);}

  .confirm-card{border-left:4px solid var(--good); }
  .confirm-card .cid{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--good); letter-spacing:.02em;}

  .info-note{
    display:flex; gap:12px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius:var(--radius); padding:14px 16px; font-size:13.5px; color:var(--ink);
  }
  .info-note .ico{flex:none; font-family:var(--font-mono); font-weight:700; color:var(--accent-ink);}

  /* ============ MY SUBMISSIONS ============ */
  .track-toolbar{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-faint); border:1px dashed var(--line-strong);
    border-radius:var(--radius);
  }
  .item-list{display:grid; gap:16px;}
  .item-card{border-left:4px solid var(--line-strong);}
  .item-card[data-status="submitted"]{border-left-color:var(--accent);}
  .item-card[data-status="review"]{border-left-color:var(--warn);}
  .item-card[data-status="revise"]{border-left-color:var(--danger);}
  .item-card[data-status="accepted"]{border-left-color:var(--good);}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .item-title{font-family:var(--font-display); font-weight:600; font-size:17px; margin-bottom:3px;}
  .item-sub{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .item-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .status-select{
    font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:5px 8px; border-radius:99px;
    border:1px solid var(--line-strong); background:var(--surface);
  }
  .item-body{margin-top:12px; font-size:14px; color:var(--ink-soft); display:grid; gap:4px;}
  .log{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .log h5{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-family:var(--font-mono); font-weight:600;}
  .log-entry{display:flex; gap:10px; padding:7px 0; border-bottom:1px dotted var(--line); font-size:13.5px;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .le-date{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); flex:none; width:82px; padding-top:2px;}
  .log-add{display:flex; gap:8px; margin-top:10px;}
  .log-add input{flex:1; font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border-radius:7px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);}
  .item-foot{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}

  /* ============ CONTACTS ============ */
  .contact-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media (max-width:760px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-card .role{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-ink); margin-bottom:6px;}
  .contact-card .name{font-weight:700; font-size:15.5px;}
  .contact-card .aff{font-size:13px; color:var(--ink-faint); margin:2px 0 10px;}
  .contact-card .cline{font-size:13.5px; display:flex; gap:8px; align-items:center; margin-top:4px;}
  .venue-block{margin-top:26px;}

  footer.site{border-top:1px solid var(--line); margin-top:20px; padding:34px 0; font-size:13px; color:var(--ink-faint);}
  footer.site .container{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;}

  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important; transition:none!important;} }
</style>

<div class="grid-ground" aria-hidden="true"></div>

<header class="site">
  <div class="head-row">
    <nav class="tabs" id="mainNav" aria-label="Розділи сайту">
      <button type="button" data-nav="home"></button>
      <button type="button" data-nav="about"></button>
      <button type="button" data-nav="register"></button>
      <button type="button" data-nav="submit"></button>
      <button type="button" data-nav="status"></button>
      <button type="button" data-nav="contacts"></button>
    </nav>
    <div class="head-controls">
      <button class="theme-toggle lang-toggle" id="langToggle" type="button"></button>
      <button class="theme-toggle" id="themeToggle" type="button">◐</button>
    </div>
  </div>
</header>

<main>

<!-- ================= HOME ================= -->
<section class="view" id="view-home">
  <div class="container">
    <div class="hero">
      <div class="letterhead" id="letterheadShort"></div>

      <div class="eyebrow"><span class="dash"></span><span id="homeEyebrow"></span></div>

      contactsPanel:'For any questions about participation, contact the organizing committee: <a class="mono" href="mailto:kovalevskii61@gmail.com">kovalevskii61@gmail.com</a> · <span class="mono">+38 050 478 0394</span>',

      footerLine1:'XVIII International Scientific Conference "Modern Education — Accessibility, Quality, Recognition" · 13–14 November 2026 · Vinnytsia',
      footerLine2:'Electronic conference proceedings with an ISBN',

      embedPlaceholderRegister:'The registration Google Form has not been connected yet.',
      embedPlaceholderManuscript:'The manuscript submission Google Form has not been connected yet.',
      embedPlaceholderRevision:'The reviewer-response Google Form has not been connected yet.',
      embedVarNote:function(v){ return 'Paste the URL into the ' + v + ' variable near the top of the file (CONFIG section).'; },
      embedOpenLink:'Open in a new tab ↗'
    }
  };

  /* ---------------- HELPERS ---------------- */
  function $(sel, ctx){ return (ctx||document).querySelector(sel); }
  function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function fmtDate(d){ return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
  function daysBetween(a,b){ return Math.ceil((b - a) / 86400000); }
  function setText(id, text){ var e = document.getElementById(id); if(e) e.textContent = text; }
  function setHtml(id, html){ var e = document.getElementById(id); if(e) e.innerHTML = html; }

  var DEADLINE = new Date(2026,9,30); // 30 жовтня 2026 / 30 October 2026
  var CONF_START = new Date(2026,10,13); // 13 листопада 2026 / 13 November 2026
  var REF_DATES = { DEADLINE:DEADLINE, CONF_START:CONF_START };
  var NOW = new Date();

  /* ---------------- LANGUAGE STATE ---------------- */
  var LANG_DEFAULT = 'en';
  var currentLang = LANG_DEFAULT;

  /* ---------------- NAV ---------------- */
  var VIEWS = ['home','about','register','submit','status','contacts'];
  function showView(name){
    if(VIEWS.indexOf(name) === -1) name = 'home';
    VIEWS.forEach(function(v){
      var sec = document.getElementById('view-'+v);
      if(sec) sec.hidden = (v !== name);
    });
    $all('nav.tabs button').forEach(function(b){
      if(b.getAttribute('data-nav') === name) b.setAttribute('aria-current','page');
      else b.removeAttribute('aria-current');
    });
    window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant':'auto'});
    history.replaceState(null,'','#'+name);
  }
  $all('[data-nav]').forEach(function(b){
    b.addEventListener('click', function(){ showView(b.getAttribute('data-nav')); });
  });
  window.addEventListener('DOMContentLoaded', function(){
    var h = location.hash.replace('#','');
    showView(h || 'home');
  });

  /* ---------------- THEME TOGGLE ---------------- */
  var themeBtn = document.getElementById('themeToggle');
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? null : 'dark');
    applyTheme(next);
  });

  /* ---------------- RENDER: STATIC TEXT (language-dependent) ---------------- */
  function renderStaticText(){
    var t = I18N[currentLang];
    document.getElementById('pageTitle').textContent = t.pageTitle;
    document.title = t.pageTitle;
    document.documentElement.lang = currentLang;

    document.getElementById('mainNav').setAttribute('aria-label', t.navAria);
    $all('nav.tabs button').forEach(function(b){
      var key = b.getAttribute('data-nav');
      if(t.nav[key]) b.textContent = t.nav[key];
    });

    themeBtn.title = t.themeTitle; themeBtn.setAttribute('aria-label', t.themeTitle);
    var langBtn = document.getElementById('langToggle');
    langBtn.textContent = t.langBtn; langBtn.title = t.langTitle; langBtn.setAttribute('aria-label', t.langTitle);

    setText('homeEyebrow', t.homeEyebrow);
    setText('homeTitle', t.homeTitle);
    setText('homeLede', t.homeLede);
    setText('metaDatesK', t.metaDatesK); setText('metaDatesV', t.metaDatesV);
    setText('metaVenueK', t.metaVenueK); setText('metaVenueV', t.metaVenueV);
    setText('metaFormatK', t.metaFormatK); setText('metaFormatV', t.metaFormatV);
    setText('metaLangK', t.metaLangK); setText('metaLangV', t.metaLangV);
    setText('metaFeeK', t.metaFeeK); setText('metaFeeV', t.metaFeeV);
    setText('ctaRegister', t.ctaRegister); setText('ctaSubmit', t.ctaSubmit); setText('ctaAbout', t.ctaAbout);
    setText('statSectionsL', t.statSectionsL); setText('statPartnersL', t.statPartnersL);
    setText('statDeadlineL', t.statDeadlineL); setText('statIsbnL', t.statIsbnL);
    setText('keyDatesEyebrow', t.keyDatesEyebrow);
    setText('howEyebrow', t.howEyebrow);
    setHtml('step1', t.step1); setHtml('step2', t.step2); setHtml('step3', t.step3);
    setText('homeInfoNote', t.homeInfoNote);

    setText('aboutEyebrow', t.aboutEyebrow);
    setText('aboutH2', t.aboutH2);
    setText('goalsH3', t.goalsH3);
    setText('goal1', t.goal1); setText('goal2', t.goal2); setText('goal3', t.goal3);
    setText('orgsH3', t.orgsH3);
    setText('orgsLede', t.orgsLede);
    setText('committeeH3', t.committeeH3);
    setText('langH3', t.langH3);
    setText('badgeUk', t.badgeUk);
    setText('topicsH3', t.topicsH3);

    setText('registerEyebrow', t.registerEyebrow);
    setText('registerH2', t.registerH2);
    setText('registerLede', t.registerLede);
    setText('registerInfoEyebrow', t.registerInfoEyebrow);
    setHtml('registerInfoNote', t.registerInfoNote);
    setText('registerPanelTitle', t.registerPanelTitle);

    setText('submitEyebrow', t.submitEyebrow);
    setText('submitH2', t.submitH2);
    setHtml('submitLede', t.submitLede);
    setText('checklistLegend', t.checklistLegend);
    setText('submitFormEyebrow', t.submitFormEyebrow);
    setText('reqPanelTitle', t.reqPanelTitle);
    setText('submitWarnNote', t.submitWarnNote);

    setText('statusEyebrow', t.statusEyebrow);
    setText('statusH2', t.statusH2);
    setText('statusLede', t.statusLede);
    setHtml('statusGoal1', t.statusGoal1); setHtml('statusGoal2', t.statusGoal2);
    setHtml('statusGoal3', t.statusGoal3); setHtml('statusGoal4', t.statusGoal4);
    setText('statusInfoNote1', t.statusInfoNote1);
    setText('statusFormEyebrow', t.statusFormEyebrow);
    setHtml('statusInfoNote2', t.statusInfoNote2);

    setText('contactsEyebrow', t.contactsEyebrow);
    setText('contactsH2', t.contactsH2);
    setText('venueEyebrow', t.venueEyebrow);
    setText('venueName', t.venueName);
    setText('venueDept', t.venueDept);
    setText('venueLine', t.venueLine);
    setHtml('contactsPanel', t.contactsPanel);

    setText('footerLine1', t.footerLine1);
    setText('footerLine2', t.footerLine2);
  }

  /* ---------------- RENDER: DATA-DRIVEN LISTS (rebuilt on language switch) ---------------- */
  function renderLetterhead(){
    var lh = document.getElementById('letterheadShort');
    lh.textContent = I18N[currentLang].letterhead;
  }

  function renderOrgs(){
    var orgFull = document.getElementById('orgListFull');
    orgFull.innerHTML = '';
    ORGS.forEach(function(o){ orgFull.appendChild(el('li',{},[o[currentLang]])); });
  }

  function renderCommittee(){
    var cg = document.getElementById('committeeGrid');
    cg.innerHTML = '';
    COMMITTEE.forEach(function(p){
      var pair = p[currentLang];
      cg.appendChild(el('div',{class:'person'},[
        el('div',{class:'p-name'},[pair[0]]),
        el('div',{class:'p-role'},[pair[1]])
      ]));
    });
  }

  function renderSections(){
    var sg = document.getElementById('sectionsGrid');
    var miniList = document.getElementById('sectionMiniList');
    sg.innerHTML = ''; miniList.innerHTML = '';
    var label = I18N[currentLang].sectionLabel;
    SECTIONS.forEach(function(s){
      var d = s[currentLang];
      var card = el('div',{class:'card section-card'},[
        el('div',{class:'sc-head'},[
          el('span',{class:'sc-num'},[label+' '+s.n]),
          el('h3',{},[d.title])
        ]),
        el('ul',{},d.items.map(function(it){ return el('li',{},[it]); }))
      ]);
      sg.appendChild(card);
      miniList.appendChild(el('li',{},[d.title]));
    });
  }

  function renderContacts(){
    var cgrid = document.getElementById('contactGrid');
    cgrid.innerHTML = '';
    CONTACTS.forEach(function(c){
      var d = c[currentLang];
      var lines = [
        el('div',{class:'role'},[d.role]),
        el('div',{class:'name'},[d.name]),
        el('div',{class:'aff'},[d.aff]),
        el('div',{class:'cline'},['✉ ', el('a',{href:'mailto:'+c.email, class:'mono'},[c.email])])
      ];
      if(c.phone) lines.push(el('div',{class:'cline'},['☎ ', el('span',{class:'mono'},[c.phone])]));
      cgrid.appendChild(el('div',{class:'card contact-card'}, lines));
    });
  }

  function renderReqList(){
    var reqList = document.getElementById('reqList');
    reqList.innerHTML = '';
    REQ_LIST[currentLang].forEach(function(it){ reqList.appendChild(el('li',{},[it])); });
  }

  function renderTimeline(){
    var tl = document.getElementById('timelineList');
    tl.innerHTML = '';
    TL_DATA.forEach(function(item){
      var d = item[currentLang];
      var ref = item.refKey ? REF_DATES[item.refKey] : null;
      var cls = '';
      if(ref){
        if(NOW > ref) cls = 'done';
        else if(daysBetween(NOW, ref) <= 14) cls = 'now';
      }
      var countdown = '';
      if(ref && NOW <= ref){
        countdown = currentLang === 'uk' ? ('через ' + daysBetween(NOW, ref) + ' дн.') : ('in ' + daysBetween(NOW, ref) + ' days');
      }
      tl.appendChild(el('li',{class:cls},[
        el('div',{class:'tl-date'},[d.date]),
        el('div',{class:'tl-title'},[d.title]),
        el('div',{class:'tl-desc'},[d.desc]),
        countdown ? el('div',{class:'countdown'},[countdown]) : ''
      ]));
    });

    var daysToDeadline = daysBetween(NOW, DEADLINE);
    document.getElementById('statDeadlineDays').textContent = daysToDeadline > 0 ? daysToDeadline : '0';

    var deadlineNote = document.getElementById('deadlineNote');
    var t = I18N[currentLang];
    if(daysToDeadline > 0){
      deadlineNote.textContent = t.deadlineRemaining(daysToDeadline);
      document.getElementById('deadlineIco').textContent = 'i';
    } else {
      deadlineNote.textContent = t.deadlinePassed;
      document.getElementById('deadlineIco').textContent = '!';
    }
  }

  /* ---------------- CHECKLIST (self-check) — built once, labels re-lang'd in place ---------------- */
  var clWrap = document.getElementById('checklistWrap');
  var clInputs = [];
  var clGroupHeaders = [];
  var clItemLabels = [];
  CHECKLIST.forEach(function(g, gi){
    var group = el('div',{class:'cl-group'});
    var h4 = el('h4',{},[g.uk.group]);
    clGroupHeaders.push({ el:h4, data:g });
    group.appendChild(h4);
    g.uk.items.forEach(function(text, idx){
      var cb = el('input',{type:'checkbox', id:'cl_'+gi+'_'+idx});
      clInputs.push(cb);
      var textSpan = el('span',{},[text]);
      clItemLabels.push({ el:textSpan, data:g, idx:idx });
      var label = el('label',{class:'cl-item', for:cb.id},[]);
      label.appendChild(cb);
      label.appendChild(textSpan);
      group.appendChild(label);
    });
    clWrap.appendChild(group);
  });
  var clBar = document.getElementById('clBar');
  var clCount = document.getElementById('clCount');
  function updateChecklistCount(){
    var total = clInputs.length;
    var checked = clInputs.filter(function(c){ return c.checked; }).length;
    clBar.style.width = (total ? (checked/total*100) : 0) + '%';
    clCount.textContent = I18N[currentLang].clCountTpl(checked, total);
  }
  clInputs.forEach(function(c){ c.addEventListener('change', updateChecklistCount); });
  function renderChecklistLang(){
    clGroupHeaders.forEach(function(h){ h.el.textContent = h.data[currentLang].group; });
    clItemLabels.forEach(function(it){ it.el.textContent = it.data[currentLang].items[it.idx]; });
    updateChecklistCount();
  }

  /* ---------------- GOOGLE EMBEDS — iframe built once, only link/placeholder text re-lang'd ---------------- */
  function toEmbedUrl(url){
    if(url.indexOf('docs.google.com/forms') !== -1 || url.indexOf('forms.gle') !== -1){
      return url + (url.indexOf('?') === -1 ? '?embedded=true' : '&embedded=true');
    }
    return url;
  }
  var embedDefs = [
    { containerId:'gform-register', url:CONFIG.formRegister, varName:'CONFIG.formRegister', placeholderKey:'embedPlaceholderRegister', btnClass:'btn-primary', height:'900' },
    { containerId:'gform-manuscript', url:CONFIG.formManuscript, varName:'CONFIG.formManuscript', placeholderKey:'embedPlaceholderManuscript', btnClass:'btn-gold', height:'900' },
    { containerId:'gform-revision', url:CONFIG.formRevision, varName:'CONFIG.formRevision', placeholderKey:'embedPlaceholderRevision', btnClass:'btn-primary', height:'760' }
  ];
  var embedLinkEls = {};   // containerId -> <a> element (when url present)
  var embedEmptyEls = {};  // containerId -> {msgEl, noteEl, def} (when url absent)

  function buildEmbeds(){
    embedDefs.forEach(function(def){
      var host = document.getElementById(def.containerId);
      if(!host) return;
      host.innerHTML = '';
      if(!def.url){
        var msgEl = el('div',{style:'margin-bottom:6px;'},['']);
        var noteEl = el('div',{class:'mono', style:'font-size:12px;'},['']);
        host.appendChild(el('div',{class:'empty-state'},[msgEl, noteEl]));
        embedEmptyEls[def.containerId] = { msgEl:msgEl, noteEl:noteEl, def:def };
        return;
      }
      host.appendChild(el('iframe',{
        src: toEmbedUrl(def.url), width:'100%', height: def.height, frameborder:'0',
        marginheight:'0', marginwidth:'0', loading:'lazy', style:'border:0; border-radius:8px; display:block;'
      },[]));
      var link = el('a',{class:'btn '+def.btnClass+' btn-sm', href:def.url, target:'_blank', rel:'noopener'},['']);
      host.appendChild(el('div',{style:'margin-top:14px;'},[link]));
      embedLinkEls[def.containerId] = link;
    });
  }
  function renderEmbedsLang(){
    var t = I18N[currentLang];
    Object.keys(embedLinkEls).forEach(function(id){ embedLinkEls[id].textContent = t.embedOpenLink; });
    Object.keys(embedEmptyEls).forEach(function(id){
      var rec = embedEmptyEls[id];
      rec.msgEl.textContent = t[rec.def.placeholderKey] || '';
      rec.noteEl.textContent = t.embedVarNote(rec.def.varName);
    });
  }

  /* ---------------- LANGUAGE SWITCH ---------------- */
  var langBtnEl = document.getElementById('langToggle');
  function applyLang(lang){
    currentLang = (lang === 'en') ? 'en' : 'uk';
    renderStaticText();
    renderLetterhead();
    renderOrgs();
    renderCommittee();
    renderSections();
    renderContacts();
    renderReqList();
    renderTimeline();
    renderChecklistLang();
    renderEmbedsLang();
  }
  langBtnEl.addEventListener('click', function(){
    applyLang(currentLang === 'uk' ? 'en' : 'uk');
  });

  /* ---------------- INIT ---------------- */
  buildEmbeds();
  applyLang(LANG_DEFAULT);

})();
</script>
