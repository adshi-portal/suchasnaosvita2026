<title id="pageTitle">РќРњРўР—-2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#EEF0F4;
    --surface:#FFFFFF;
    --surface-2:#F3F4F9;
    --ink:#181B29;
    --ink-soft:#474C63;
    --ink-faint:#7A7F97;
    --line:#D7D9E6;
    --line-strong:#B7BBD4;
    --accent:#4B3FD1;
    --accent-ink:#332793;
    --accent-soft:#E4E1FA;
    --teal:#0E7C86;
    --teal-ink:#0A5D65;
    --teal-soft:#DCEFF1;
    --good:#227A54;
    --good-soft:#DFF1E7;
    --warn:#A9660F;
    --warn-soft:#F5E7CE;
    --danger:#B23A3A;
    --danger-soft:#F5DEDE;
    --shadow: 0 1px 2px rgba(20,20,40,.06), 0 10px 26px -14px rgba(20,20,40,.22);
    --radius:10px;
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-body:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1020; --surface:#171A33; --surface-2:#12142A;
      --ink:#E7E7F2; --ink-soft:#B7B9D6; --ink-faint:#8388AC;
      --line:#2B2F52; --line-strong:#3C4270;
      --accent:#8B84F0; --accent-ink:#C9C5FA; --accent-soft:#231F55;
      --teal:#4FC2CC; --teal-ink:#B9EDF1; --teal-soft:#0F3238;
      --good:#7FD1A6; --good-soft:#123524;
      --warn:#E7B45E; --warn-soft:#3A2C12;
      --danger:#E28787; --danger-soft:#3A1E1E;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1020; --surface:#171A33; --surface-2:#12142A;
    --ink:#E7E7F2; --ink-soft:#B7B9D6; --ink-faint:#8388AC;
    --line:#2B2F52; --line-strong:#3C4270;
    --accent:#8B84F0; --accent-ink:#C9C5FA; --accent-soft:#231F55;
    --teal:#4FC2CC; --teal-ink:#B9EDF1; --teal-soft:#0F3238;
    --good:#7FD1A6; --good-soft:#123524;
    --warn:#E7B45E; --warn-soft:#3A2C12;
    --danger:#E28787; --danger-soft:#3A1E1E;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; text-wrap:balance; color:var(--ink);}
  p{margin:0 0 1em;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
  .mono{font-family:var(--font-mono);}
  .container{max-width:1080px; margin:0 auto; padding:0 24px;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none!important;}

  /* faint node-field texture, evoking a neural-network graph */
  .grid-ground{
    background-image:radial-gradient(var(--line-strong) 1.3px, transparent 1.3px);
    background-size:26px 26px;
    background-position:center top;
    opacity:.55;
    position:fixed; inset:0; z-index:0; pointer-events:none;
    mask-image:linear-gradient(to bottom, black, transparent 640px);
  }

  /* ============ HEADER / NAV ============ */
  header.site{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .head-row{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:14px 24px; max-width:1080px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-right:auto; text-decoration:none;}
  .brand-mark{
    width:40px; height:40px; border-radius:8px;
    background:linear-gradient(155deg, var(--accent), var(--accent-ink));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.01em;
    flex:none; box-shadow:var(--shadow);
  }
  nav.tabs{display:flex; gap:2px; flex-wrap:wrap;}
  nav.tabs button{
    border:1px solid transparent; background:transparent; color:var(--ink-soft);
    padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer;
    font-weight:500; transition:background .15s, color .15s;
  }
  nav.tabs button:hover{background:var(--surface-2); color:var(--ink);}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .head-controls{display:flex; align-items:center; gap:8px; flex:none;}
  .theme-toggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:36px; height:36px; border-radius:8px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .lang-toggle{ width:auto; padding:0 12px; font-family:var(--font-mono); font-weight:700; font-size:12.5px; letter-spacing:.03em; }

  /* ============ GENERIC LAYOUT ============ */
  main{position:relative; z-index:1;}
  section.view{padding:52px 0 88px;}
  .eyebrow{
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em;
    font-size:12px; color:var(--accent-ink); font-weight:600; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dash{width:20px; height:1px; background:var(--accent);}
  .lede{font-size:18px; color:var(--ink-soft); max-width:64ch;}
  .col-2{display:grid; grid-template-columns:1.3fr 1fr; gap:40px;}
  .col-3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:860px){ .col-2{grid-template-columns:1fr;} .col-3{grid-template-columns:1fr;} }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); }
  .panel{ background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--radius); padding:18px 20px; }
  .divider{height:1px; background:var(--line); border:0; margin:40px 0;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:11px 20px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    text-decoration:none; transition:transform .1s ease, background .15s, border-color .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-teal{background:var(--teal); color:#fff;}
  .btn-teal:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:7px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .btn[disabled]:hover{background:var(--accent);}

  .badge{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
    font-size:11.5px; letter-spacing:.03em; padding:4px 9px; border-radius:99px;
    border:1px solid var(--line-strong); color:var(--ink-soft); text-transform:uppercase;
  }

  /* ============ HOME / HERO ============ */
  .hero{padding:44px 0 20px;}
  .letterhead{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    display:flex; flex-wrap:wrap; gap:6px 14px; line-height:1.5; margin-bottom:30px; max-width:920px;
  }
  h1.title{ font-size:clamp(30px,5.6vw,60px); line-height:1.1; width:100%; color:var(--accent-ink); margin:6px 0 26px; }
  .meta-row{display:flex; flex-wrap:wrap; gap:10px 26px; margin:22px 0 30px; font-size:14.5px;}
  .meta-item{display:flex; align-items:center; gap:8px; color:var(--ink-soft);}
  .meta-item .k{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .cta-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px;}

  .path-fork{margin:36px 0;}
  .path-card h3{font-size:19px;}
  .path-card p{font-size:14.5px; color:var(--ink-soft);}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:44px 0;}
  .stat{background:var(--surface); padding:18px 20px;}
  .stat .n{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--accent-ink); font-variant-numeric:tabular-nums;}
  .stat .l{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  @media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

  .timeline{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); margin-left:6px;}
  .timeline li{position:relative; padding:2px 0 26px 26px;}
  .timeline li::before{ content:''; position:absolute; left:-7px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); }
  .timeline li.done::before{background:var(--good); border-color:var(--good);}
  .timeline li.now::before{background:var(--teal); border-color:var(--teal); box-shadow:0 0 0 4px var(--teal-soft);}
  .timeline .tl-date{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
  .timeline .tl-title{font-weight:600; margin:2px 0 2px;}
  .timeline .tl-desc{font-size:14px; color:var(--ink-soft);}
  .countdown{font-family:var(--font-mono); font-size:12.5px; color:var(--teal-ink); font-weight:600;}

  /* ============ ABOUT ============ */
  .org-list{ columns:2 260px; column-gap:28px; font-size:13.5px; color:var(--ink-soft); list-style:none; margin:0; padding:0; }
  .org-list li{ break-inside:avoid; padding:5px 0 5px 16px; position:relative; border-bottom:1px dotted var(--line); }
  .org-list li::before{content:'вЂ”'; position:absolute; left:0; color:var(--ink-faint);}

  .goal-list{list-style:none; margin:0; padding:0; display:grid; gap:14px;}
  .goal-list li{display:flex; gap:14px; align-items:flex-start;}
  .goal-num{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-ink); background:var(--accent-soft);
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex:none; font-weight:600; margin-top:1px;
  }

  .committee-grid{ columns:2 300px; column-gap:26px; font-size:13.5px; }
  .committee-grid .person{break-inside:avoid; padding:9px 0; border-bottom:1px solid var(--line);}
  .committee-grid .p-role{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--teal-ink); margin-bottom:2px;}
  .committee-grid .p-name{font-weight:600; color:var(--ink);}
  .committee-grid .p-aff{color:var(--ink-faint); font-size:12.5px;}

  .section-card{border-top:3px solid var(--accent);}
  .section-card .sc-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .section-card .sc-num{font-family:var(--font-mono); color:var(--accent-ink); font-weight:700; font-size:12.5px;}
  .section-card h3{font-size:17px; margin:0;}
  .section-card p{margin:0; color:var(--ink-soft); font-size:14px;}
  .topics-note{font-size:13.5px; color:var(--ink-faint); margin-top:18px;}

  .lang-row{display:flex; gap:10px; margin-top:6px;}

  /* ============ FIELDSETS / CHECKLIST ============ */
  fieldset{border:none; padding:0; margin:0;}
  legend{font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:0 0 10px;}
  .checklist{display:grid; gap:10px;}
  .checklist .cl-group{border:1px solid var(--line); border-radius:8px; padding:12px 14px;}
  .checklist .cl-group h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-mono); color:var(--ink-faint); margin:0 0 8px; font-weight:600;}
  .cl-item{display:flex; align-items:flex-start; gap:9px; padding:5px 0; font-size:14px;}
  .cl-item input{margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--accent);}
  .cl-progress{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:4px 0 2px;}
  .cl-progress > i{display:block; height:100%; background:var(--accent); width:0%; transition:width .2s;}
  .hint{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .info-note{
    display:flex; gap:12px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius:var(--radius); padding:14px 16px; font-size:13.5px; color:var(--ink);
  }
  .info-note.warn{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 45%, var(--line));}
  .info-note .ico{flex:none; font-family:var(--font-mono); font-weight:700; color:var(--accent-ink);}
  .info-note.warn .ico{color:var(--warn);}

  /* ============ REGISTRATION FORM ============ */
  .reg-card{border-left:4px solid var(--accent);}
  .reg-block{border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px;}
  .reg-block legend{padding:0 0 12px;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  @media (max-width:640px){ .field-grid{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .field.required label::after{content:' *'; color:var(--danger);}
  .field .hint{margin-top:1px;}
  .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field select, .field textarea{
    font-family:var(--font-body); font-size:15px; padding:9px 11px; border-radius:7px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); width:100%;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field input:invalid:not(:placeholder-shown){border-color:var(--danger);}
  .radio-row{display:flex; gap:16px; flex-wrap:wrap;}
  .radio-row label{display:flex; align-items:center; gap:7px; font-size:14.5px; cursor:pointer; font-weight:400;}
  .radio-row input{accent-color:var(--accent); width:16px; height:16px;}
  .consent-row{display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--ink-soft);}
  .consent-row input{margin-top:3px; flex:none; width:17px; height:17px; accent-color:var(--accent);}
  .form-actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-top:6px;}
  .msg{font-size:13.5px; padding:10px 13px; border-radius:8px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--good-soft); color:var(--good);}
  .msg.err{background:var(--danger-soft); color:var(--danger);}
  .config-notice{margin-bottom:18px;}
  .confirm-card{border-left:4px solid var(--good);}
  .confirm-card h3{color:var(--good); font-size:19px;}

  /* ============ GOOGLE FORM EMBEDS (manuscript / revision) ============ */
  .gform-frame{border:0; border-radius:8px; display:block; width:100%;}
  .empty-state{
    text-align:center; padding:36px 20px; color:var(--ink-faint);
    border:1px dashed var(--line-strong); border-radius:var(--radius);
  }
  .empty-state .es-msg{margin-bottom:6px; color:var(--ink-soft);}
  .empty-state .es-note{font-size:12px;}

  /* ============ CONTACTS ============ */
  .contact-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media (max-width:760px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-card .role{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--teal-ink); margin-bottom:6px;}
  .contact-card .name{font-weight:700; font-size:15.5px;}
  .contact-card .aff{font-size:13px; color:var(--ink-faint); margin:2px 0 10px;}
  .contact-card .cline{font-size:13.5px; display:flex; gap:8px; align-items:center; margin-top:4px;}
  .venue-block{margin-top:26px;}

  footer.site{border-top:1px solid var(--line); margin-top:20px; padding:34px 0; font-size:13px; color:var(--ink-faint);}
  footer.site .container{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;}

  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important; transition:none!important;} }
</style>

<div class="grid-ground" aria-hidden="true"></div>

<header class="site">
  <div class="head-row">
    <nav class="tabs" id="mainNav" aria-label="Р РѕР·РґС–Р»Рё СЃР°Р№С‚Сѓ">
      <button type="button" data-nav="home"></button>
      <button type="button" data-nav="about"></button>
      <button type="button" data-nav="register"></button>
      <button type="button" data-nav="submit"></button>
      <button type="button" data-nav="status"></button>
      <button type="button" data-nav="contacts"></button>
    </nav>
    <div class="head-controls">
      <button class="theme-toggle lang-toggle" id="langToggle" type="button"></button>
      <button class="theme-toggle" id="themeToggle" type="button">в—ђ</button>
    </div>
  </div>
</header>

<main>

<!-- ================= HOME ================= -->
<section class="view" id="view-home">
  <div class="container">
    <div class="hero">
      <div class="letterhead" id="letterheadShort"></div>
      <div class="eyebrow"><span class="dash"></span><span id="homeEyebrow"></span></div>
      <h1 class="title" id="homeTitle"></h1>
      <p class="lede" id="homeLede"></p>

      <div class="meta-row">
        <div class="meta-item"><span class="k" id="metaDatesK"></span><span id="metaDatesV"></span></div>
        <div class="meta-item"><span class="k" id="metaVenueK"></span><span id="metaVenueV"></span></div>
        <div class="meta-item"><span class="k" id="metaFormatK"></span><span id="metaFormatV"></span></div>
        <div class="meta-item"><span class="k" id="metaLangK"></span><span id="metaLangV"></span></div>
        <div class="meta-item"><span class="k" id="metaFeeK"></span><span id="metaFeeV"></span></div>
      </div>

      <div class="cta-row">
        <button class="btn btn-primary" data-nav="register" id="ctaRegister"></button>
        <button class="btn btn-teal" data-nav="submit" id="ctaSubmit"></button>
        <button class="btn btn-ghost" data-nav="about" id="ctaAbout"></button>
      </div>
    </div>

    <!-- two separate scenarios: attending vs. submitting a paper -->
    <div class="col-2 path-fork">
      <div class="card path-card">
        <div class="eyebrow"><span class="dash"></span><span id="pathAEyebrow"></span></div>
        <h3 id="pathATitle"></h3>
        <p id="pathAText"></p>
        <button class="btn btn-primary" data-nav="register" id="pathABtn"></button>
      </div>
      <div class="card path-card">
        <div class="eyebrow"><span class="dash"></span><span id="pathBEyebrow"></span></div>
        <h3 id="pathBTitle"></h3>
        <p id="pathBText"></p>
        <button class="btn btn-teal" data-nav="submit" id="pathBBtn"></button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="n">7</div><div class="l" id="statSectionsL"></div></div>
      <div class="stat"><div class="n">15</div><div class="l" id="statPartnersL"></div></div>
      <div class="stat"><div class="n" id="statDeadlineDays">вЂ”</div><div class="l" id="statDeadlineL"></div></div>
      <div class="stat"><div class="n" id="statDigestN"></div><div class="l" id="statDigestL"></div></div>
    </div>

    <div class="col-2">
      <div>
        <div class="eyebrow"><span class="dash"></span><span id="keyDatesEyebrow"></span></div>
        <ul class="timeline" id="timelineList"></ul>
      </div>
      <div>
        <div class="eyebrow"><span class="dash"></span><span id="howEyebrow"></span></div>
        <div class="card" style="margin-bottom:14px;">
          <p style="margin-bottom:8px;" id="step1"></p>
          <p style="margin-bottom:8px;" id="step2"></p>
          <p style="margin-bottom:8px;" id="step3"></p>
          <p style="margin-bottom:8px;" id="step4"></p>
          <p style="margin-bottom:0;" id="step5"></p>
        </div>
        <div class="hint" style="margin-bottom:14px;" id="stepsNote"></div>
        <div class="info-note"><span class="ico">i</span><span id="homeInfoNote"></span></div>
      </div>
    </div>
  </div>

      else e.setAttribute(k, attrs[k]);

  function buildRadioGroup(containerId, name, options, groupKey, required){
    var wrap = document.getElementById(containerId);
    wrap.innerHTML = '';
    regRadioGroups[groupKey] = [];
    options.forEach(function(opt, i){
      var attrs = {type:'radio', name:name, value:opt.value, id:name+'_'+i};
      // HTML5: marking ONE radio in a name-group required is enough to require the whole group
      if(required && i === 0) attrs.required = 'required';
      var input = el('input', attrs);
      var label = el('label',{},[]);
      label.appendChild(input);
      var span = el('span',{},[opt.uk]);
      label.appendChild(span);
      wrap.appendChild(label);
      regRadioGroups[groupKey].push({ input:input, span:span, opt:opt });
    });

  }
  function hideRegMsg(){ regMsgEl.className = 'msg'; regMsgEl.textContent = ''; }

  var regThankYou = document.getElementById('regThankYou');
  function showRegThankYou(){
    regForm.hidden = true;
    regThankYou.hidden = false;
    regThankYou.scrollIntoView({ block:'start', behavior:'smooth' });
  }

  /* the browser's native constraint validation (required / type=email / pattern) blocks the
     'submit' event and shows its own accessible error bubbles before this handler ever runs вЂ”
     so by the time we get here, every required field is present and correctly formatted. */
  regForm.addEventListener('submit', function(e){
    hideRegMsg();
    if(!isRegistrationConfigured()){
      e.preventDefault();
      showRegMsg('err', I18N[currentLang].regNotConfigured);
      return;
    }
    regSubmitFlag = true;
  });

  regHiddenFrame.addEventListener('load', function(){
    if(regSubmitFlag){
      regSubmitFlag = false;
      showRegThankYou();
    }
  });

  /* ---------------- GOOGLE FORM EMBEDS: manuscript submission / revision ---------------- */
  var embedDefs = [
    { containerId:'gform-manuscript', url:SUBMIT_FORM_URL, placeholderKey:'embedPlaceholderManuscript', varName:'SUBMIT_FORM_URL', height:'900' },
    { containerId:'gform-revision', url:REVISION_FORM_URL, placeholderKey:'embedPlaceholderRevision', varName:'REVISION_FORM_URL', height:'760' }
  ];
  var embedLinkEls = {};  // containerId -> <a> (when a URL is configured)
  var embedEmptyEls = {}; // containerId -> {msgEl, noteEl, def} (when not configured)
  function buildEmbeds(){
    embedDefs.forEach(function(def){
      var host = document.getElementById(def.containerId);
      if(!host) return;
      host.innerHTML = '';
      if(!def.url){
        var msgEl = el('div',{class:'es-msg'},['']);
        var noteEl = el('div',{class:'mono es-note'},['']);
        host.appendChild(el('div',{class:'empty-state'},[msgEl, noteEl]));
        embedEmptyEls[def.containerId] = { msgEl:msgEl, noteEl:noteEl, def:def };
        return;
      }
      host.appendChild(el('iframe',{
        class:'gform-frame', src:toEmbedUrl(def.url), height:def.height,
        loading:'lazy', title:def.containerId
      },[]));
      var link = el('a',{class:'btn btn-ghost btn-sm', href:def.url, target:'_blank', rel:'noopener', style:'margin-top:12px;'},['']);
      host.appendChild(link);
      embedLinkEls[def.containerId] = link;
    });
  }
  function renderEmbedsLang(){
    var t = I18N[currentLang];
    Object.keys(embedLinkEls).forEach(function(id){ embedLinkEls[id].textContent = t.embedOpenLink; });
    Object.keys(embedEmptyEls).forEach(function(id){
      var rec = embedEmptyEls[id];
      rec.msgEl.textContent = t[rec.def.placeholderKey] || '';
      rec.noteEl.textContent = t.embedVarNote(rec.def.varName);
    });
  }
  buildEmbeds();

  /* ---------------- LANGUAGE SWITCH ---------------- */
  var langBtnEl = document.getElementById('langToggle');
  function applyLang(lang){
    currentLang = (lang === 'en') ? 'en' : 'uk';
    safeSet('nntiz-lang', currentLang);
    renderStaticText();
    renderLetterhead();
    renderOrgs();
    renderCommittee();
    renderSections();
    renderContacts();
    renderReqList();
    renderTimeline();
    renderChecklistLang();
    renderRegistrationOptionsLang();
    renderEmbedsLang();
  }
  langBtnEl.addEventListener('click', function(){
    applyLang(currentLang === 'uk' ? 'en' : 'uk');
  });
